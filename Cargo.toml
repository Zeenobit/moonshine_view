[package]
name = "moonshine-view"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "Generic Model/View framework designed for Bevy"
categories = ["game-development"]
keywords = ["bevy", "save", "view", "mvc"]
readme = "README.md"
homepage = "https://github.com/Zeenobit/moonshine_view"
repository = "https://github.com/Zeenobit/moonshine_view"

[dependencies]
bevy_app = "0.20"
bevy_ecs = "0.20"
bevy_utils = "0.20"
bevy_platform = "0.20"
bevy_log = "0.20"
bevy_transform = { version = "0.20", optional = true }
moonshine-kind = { version = "0.6" }
moonshine-save = { version = "0.8" }
moonshine-object = { version = "0.5", optional = true }

[features]
default = []
ext = ["bevy_transform", "moonshine-object"]

[dev-dependencies]
rand = "0.9"
bevy = "0.20"
moonshine-core = "0.7"
